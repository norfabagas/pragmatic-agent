name: Validate Agent Skills

# Manual while investigating failed runs. Avoid running on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-agent-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-skills.mjs
